<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f9f9f9; }
        .chart-container { width: 900px; height: 600px; position: relative; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Text Box Styles */
        .annotation-box {
            position: absolute;
            background: rgba(230, 230, 230, 0.7);
            border: 1px solid #ccc;
            padding: 10px;
            font-size: 14px;
            line-height: 1.4;
            border-radius: 4px;
            pointer-events: none;
        }

        /* Specific positions for the boxes */
        .box-early { top: 120px; left: 80px; width: 220px; }
        .box-optimal { bottom: 100px; left: 350px; width: 240px; text-align: center; }
        .box-future { top: 120px; right: 60px; width: 240px; }

        /* Label Styles */
        .label { font-weight: bold; position: absolute; }
        .label-bias { color: #b22222; bottom: 100px; right: 50px; font-size: 18px; }
        .label-variance { color: #20b2aa; top: 220px; right: 50px; font-size: 18px; }
        .label-total { color: #000; top: 60px; right: 100px; font-size: 18px; }
        
        .axis-label { font-size: 18px; font-weight: bold; position: absolute; }
        .x-label { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .y-label { top: 50%; left: -30px; transform: translateY(-50%) rotate(-90deg); }
        
        .optimum-label { 
            position: absolute; 
            bottom: 250px; 
            left: 435px; 
            transform: rotate(-90deg); 
            font-size: 12px; 
            color: #555;
            background: white;
            padding: 0 5px;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <svg width="100%" height="100%" viewBox="0 0 900 600" preserveAspectRatio="none">
        
        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="black" />
            </marker>
        </defs>

        <line x1="50" y1="550" x2="880" y2="550" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />
        <line x1="50" y1="550" x2="50" y2="20" stroke="black" stroke-width="2" marker-end="url(#arrowhead)" />

        <line x1="450" y1="550" x2="450" y2="50" stroke="black" stroke-width="2" stroke-dasharray="5,5" />

        <path d="M 50 100 Q 250 500 850 520" fill="none" stroke="#b22222" stroke-width="3" />

        <path d="M 50 530 Q 600 500 850 100" fill="none" stroke="#20b2aa" stroke-width="3" />

        <path d="M 80 80 Q 450 650 820 50" fill="none" stroke="black" stroke-width="3" />

    </svg>

    <div class="axis-label y-label">Error</div>
    <div class="axis-label x-label">Model Complexity</div>

    <div class="label label-bias">Bias²</div>
    <div class="label label-variance">Variance</div>
    <div class="label label-total">Total Error</div>

    <div class="optimum-label">Optimum Model Complexity</div>

    <div class="annotation-box box-early">
        <strong>Pre- 2005</strong><br><br>
        Early siloed model<br>
        Disciplinary interaction
    </div>

    <div class="annotation-box box-optimal">
        <strong>2005 - ?</strong><br><br>
        Optimal multi-risk model<br>
        Actionable participatory interaction
    </div>

    <div class="annotation-box box-future">
        <strong>?</strong><br><br>
        Model of "everything"<br>
        "Too many cooks in the kitchen"
    </div>

</div>

</body>
</html>
